<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>實驗完成</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .end-container {
      width: 1110px;
      max-width: 100%;
      margin: 0 auto;
      padding: 2.25rem 1.25rem 3rem;
    }
    .end-card {
      background: #ffffff;
      border-radius: 3px;
      border: 1px solid #d7dfdc;
      padding: 2.5rem 1.75rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
      text-align: center;
    }
    .end-main {
      margin: 0 0 0.8rem;
      font-size: 3.1rem;
      line-height: 1.35;
      font-weight: 700;
      color: #1f2937;
    }
    .end-warn {
      margin: 0 0 0.8rem;
      font-size: 3.1rem;
      line-height: 1.35;
      font-weight: 700;
      color: #ef4444;
    }
    .end-last {
      margin: 0;
      font-size: 3.1rem;
      line-height: 1.35;
      font-weight: 700;
      color: #1f2937;
    }
  </style>
</head>
<body>
  <div class="end-container">
    <div class="end-card">
      <p class="end-main">實驗完成！感謝您的參與。</p>
      <p class="end-warn">由於尚有其他參與者欲進行本實驗，<br>請勿洩露本實驗相關內容。</p>
      <p class="end-last">感謝您的配合。</p>
    </div>
  </div>
</body>
</html>
